[package]
name = "pdf-engine-js"
description = "The PdfCraft PDF engine for JavaScript: open, edit, render and save PDFs in the browser or Node, with no UI and no server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/avivnofar/pdf-engine"
publish = false

[lints]
workspace = true

[lib]
# cdylib: the .wasm that wasm-pack wraps into the npm package. rlib: native tests of `core`.
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfcraft-automation = { workspace = true }
pdfcraft-engine = { workspace = true }
pdfcraft-organize = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
